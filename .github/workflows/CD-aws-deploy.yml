name: Deploy-to-AWS

on:
  workflow_run:
    workflows: ["CI-build-and-push-image-to-dockerhub"]  
    types:
      # Runs after the previous workflow completes
      - completed  

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to AWS
        run: |
          ssh ubuntu@${{ secrets.AWS_HOST }} << 'EOF'
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/invent3pro:latest
            sudo docker stop invent3pro-container || true
            sudo docker rm invent3pro-container || true
            sudo docker run -d --name invent3pro-container -p 80:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/invent3pro:latest
          EOF
